# Example: 士兰微 (600460.SS) real-data validation skeleton
# Requires: pip install yfinance

data:
  symbol: "600460.SS"
  source: yfinance
  yfinance_symbol: "600460.SS"
  start: "2018-01-01"
  end: null

structure:
  swing_left: 3
  swing_right: 3
  atr_window: 14
  liquidity_lookback: 80
  reclaim_bars: 5
  sweep_atr_buffer: 0.05

orderflow:
  volume_ma: 20
  efficiency_window: 10
  absorption_volume_z: 1.5
  absorption_range_pctile: 0.35
  imbalance_window: 5

wave_proxy:
  fib_min: 0.5
  fib_max: 0.618
  w2_reclaim_bars: 5
  w3_efficiency_min: 0.55
  w5_vol_decline_ratio: 0.85
  min_impulse_atr: 1.2

signals:
  min_score: 0.65
  long_states:
    - W2_END_CANDIDATE
    - W3_EXPAND
  short_states:
    - A_DISTRIBUTE
    - W5_EXHAUST

validation:
  horizons: [1, 3, 5, 10, 20]
  hold_bars: 5
  cost_bps: 8
  side: long_short
  min_events: 8

output:
  dir: artifacts/silan
  save_plots: true
  save_events_csv: true
